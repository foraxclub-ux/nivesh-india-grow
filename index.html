<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEADOO - Secure Portal</title>
    <!-- Tailwind CSS Dynamic Integration -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a; /* Premium Dark Navy Slate */
        }
        .custom-glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Container Box -->
    <div class="w-full max-w-md custom-glass rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6 text-white relative overflow-hidden">
        
        <!-- Background Top Glow Graphic Decor -->
        <div class="absolute -top-16 -left-16 w-36 h-36 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- App Brand Header Section -->
        <div class="text-center space-y-2 relative">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-2xl shadow-lg shadow-emerald-500/20 mb-2">
                <i class="fa-solid fa-anchor text-2xl text-slate-900"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-emerald-400 uppercase">
                SEADOO
            </h1>
            <p id="pageSubtitle" class="text-xs text-slate-400 tracking-wide font-medium">Reset Security Password</p>
        </div>

        <!-- Dynamically Toggled Content Forms Structure -->
        <div>
            <!-- FORM 1: RESET PASSWORD (Default Intent View based on URL Path) -->
            <form id="resetForm" class="space-y-4" onsubmit="handleFormSubmit(event, 'Reset Password Successful!')">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Username / Mobile</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-user"></i></span>
                        <input type="text" required placeholder="Enter username or mobile number" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">New Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" required placeholder="Create strong security password" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Confirm Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-circle-check"></i></span>
                        <input type="password" required placeholder="Confirm your new password" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Invite / Referral Code</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-ticket"></i></span>
                        <input type="text" id="resetInviteField" readonly class="w-full bg-slate-800/40 border border-slate-700/40 text-slate-400 cursor-not-allowed rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none font-mono">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold tracking-wider py-3.5 rounded-xl shadow-lg transition duration-200 uppercase text-xs mt-2">
                    Update Password
                </button>
            </form>

            <!-- FORM 2: USER LOGIN (Hidden initially, toggled dynamically) -->
            <form id="loginForm" class="space-y-4 hidden" onsubmit="handleFormSubmit(event, 'Login Authorized Successfully!')">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Account Identifier</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-user-shield"></i></span>
                        <input type="text" required placeholder="Mobile or system username" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Security Password</label>
                        <button type="button" onclick="switchTab('reset')" class="text-xs text-emerald-400 hover:underline">Forgot?</button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-key"></i></span>
                        <input type="password" required placeholder="Enter secure password" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold tracking-wider py-3.5 rounded-xl shadow-lg transition duration-200 uppercase text-xs mt-2">
                    Sign In Securely
                </button>
            </form>

            <!-- FORM 3: REGISTRATION UI (Hidden initially, toggled dynamically) -->
            <form id="registerForm" class="space-y-4 hidden" onsubmit="handleFormSubmit(event, 'Registration Complete!')">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Mobile Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" required placeholder="Enter active mobile number" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Choose Security Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" required placeholder="Min 6 characters required" class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none transition placeholder-slate-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Referral / Invite Code</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm"><i class="fa-solid fa-users"></i></span>
